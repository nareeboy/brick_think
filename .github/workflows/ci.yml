name: CI

on:
  push:
    # staging/test are included so DB migrate (a workflow_run consumer of this
    # workflow) can gate migration pushes on a green CI for those branches too.
    branches: [main, staging, test]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        # Same suite as `pnpm test`, plus v8 coverage. vitest.config.ts
        # coverage.thresholds enforces the ratchet floor — the run fails if
        # coverage drops below it.
        run: pnpm test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14

  build:
    # Catches what tsc can't: server/client boundary violations ('server-only'
    # imported from a client component), RSC serialization errors, and other
    # Next-build-only failures that would otherwise surface first on Railway.
    # build:e2e reads the committed .env.test (local-stack demo values) — no
    # secrets, no running Supabase needed: every data-fetching route is
    # dynamic, so nothing connects at build time.
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # A run-unique key always writes a fresh entry; restore-keys falls
          # back to the newest cache for this lockfile so compilation is warm.
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build:e2e

  integration:
    # The RLS + server-action correctness suite (tests/integration/**) against
    # a real local Supabase stack — the layer neither unit tests nor tsc can
    # reach. `supabase start` applies every migration to a pristine DB, so
    # this also validates the migration set on each run. Committed .env.test
    # demo values; no secrets.
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency (same pin as
          # db-migrate.yml).
          version: 2.98.2

      - name: Start local Supabase stack
        # Only the containers the suite actually touches. Studio and
        # postgres-meta are UI-only; imgproxy serves image transforms nothing in
        # the app requests; edge-runtime hosts prod-only functions; logflare +
        # vector are the log pipeline; supavisor is the pooler (both the app and
        # the Yjs worker connect to Postgres direct). Everything the suites need
        # — db, gotrue, postgrest, storage, realtime (brick comments/reactions,
        # notifications) and mailpit (invite-email + magic-link specs) — stays.
        run: supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    # Full-suite Playwright run against a pristine local Supabase stack.
    # playwright.config.ts auto-starts both app servers (`pnpm start:e2e` +
    # the Yjs worker on :1234); CI=true disables reuseExistingServer so the
    # run can never pick up a stray server. Committed .env.test demo values;
    # no secrets. Mailpit (:54324) ships with the stack — the invite-email
    # spec polls it directly. This is the longest CI job (stack start + Next
    # build + ~77 specs serialized on one worker) — it runs in parallel with
    # the other three.
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency (same pin as
          # db-migrate.yml).
          version: 2.98.2

      - name: Start local Supabase stack
        # Same trimmed container set as the integration job above.
        run: supabase start -x studio,postgres-meta,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The browser build is pinned by the @playwright/test version, so the
          # lockfile hash is the whole key.
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        # No --with-deps: the apt pass was the whole cost of this step (28s with
        # the browser cache already hot), and the ubuntu-latest image ships the
        # shared libraries Chromium needs. If a future runner image drops one,
        # the browser fails to launch and the suite fails loudly — put
        # --with-deps back rather than papering over it.
        run: pnpm exec playwright install chromium

      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # A run-unique key always writes a fresh entry; restore-keys falls
          # back to the newest cache for this lockfile so compilation is warm.
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build:e2e

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
