name: CI

on:
  push:
    # staging/test are included so DB migrate (a workflow_run consumer of this
    # workflow) can gate migration pushes on a green CI for those branches too.
    branches: [main, staging, test]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    # Catches what tsc can't: server/client boundary violations ('server-only'
    # imported from a client component), RSC serialization errors, and other
    # Next-build-only failures that would otherwise surface first on Railway.
    # build:e2e reads the committed .env.test (local-stack demo values) — no
    # secrets, no running Supabase needed: every data-fetching route is
    # dynamic, so nothing connects at build time.
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:e2e

  integration:
    # The RLS + server-action correctness suite (tests/integration/**) against
    # a real local Supabase stack — the layer neither unit tests nor tsc can
    # reach. `supabase start` applies every migration to a pristine DB, so
    # this also validates the migration set on each run. Committed .env.test
    # demo values; no secrets.
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency (same pin as
          # db-migrate.yml).
          version: 2.98.2

      - name: Start local Supabase stack
        # Studio is a UI-only container — skip it; everything the suite needs
        # (db, auth, storage, realtime, inbucket for GoTrue emails) stays on.
        run: supabase start -x studio

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    # Full-suite Playwright run against a pristine local Supabase stack.
    # playwright.config.ts auto-starts both app servers (`pnpm start:e2e` +
    # the Yjs worker on :1234); CI=true disables reuseExistingServer so the
    # run can never pick up a stray server. Committed .env.test demo values;
    # no secrets. Mailpit (:54324) ships with the stack — the invite-email
    # spec polls it directly. This is the longest CI job (stack start + Next
    # build + ~77 specs serialized on one worker) — it runs in parallel with
    # the other three.
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          # Keep in step with the `supabase` devDependency (same pin as
          # db-migrate.yml).
          version: 2.98.2

      - name: Start local Supabase stack
        run: supabase start -x studio

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build:e2e

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
